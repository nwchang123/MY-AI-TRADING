account:
  # SMALL-ACCOUNT PIVOT 2026-06-27: 2000 -> 500 to match the operator's intended
  # LIVE capital. Paper must simulate the real conditions: a strategy validated at
  # $2000 is worthless if live money is $500. $500 was untradeable BEFORE only
  # because the universe held $50-200 names whose near-money options cost >$500 --
  # now max_underlying_price_usd caps the share price (~$50) so a near-the-money,
  # high-delta contract fits the budget. Single-leg long options for now; debit
  # spreads (better cost-efficiency for a small account) are a later phase.
  initial_capital_usd: 500
  live_mode_requires_operator_flag: true
  withdrawal_capability: forbidden
  # Paper compounds: dollar caps scale with realized equity relative to this $500
  # base (grow to $1000 -> trade like a $1000 account; lose -> de-risk). Drawdown
  # is measured from the peak. Base raised 100 -> 500 on 2026-06-12: at a $100
  # base the $65 cost cap only reached deep-OTM illiquid strikes (empty universe,
  # all-zero cycles); $500 lifts the cap to $325 (ask <= ~$3.24), reaching the
  # near-the-money liquid contracts this strategy is designed for.
  # REFRAMED 2026-06-15 (operator: "use what you want, just never lose more than
  # the budget"): the budget is a FIXED TOTAL-LOSS amount, not a sizing base.
  # compounding OFF so it never scales up; the per-contract cost cap equals the
  # full budget (options.max_contract_cost_usd) so the AI sizes freely for QUALITY
  # (near-the-money) instead of deep-OTM junk; loss is hard-capped via
  # max_total_premium_at_risk_usd + hard_drawdown_stop_usd. Because these are LONG
  # options (max loss = premium paid), the premium-at-risk ceiling bounds total
  # loss to ~the budget.
  # RAISED 500 -> 2000 on 2026-06-15: at $500 a live cycle found 0/25 names with an
  # affordable quality contract (liquid names' near-money options cost >$500), so
  # the operator enlarged the budget so near-money options on liquid mid-caps fit.
  compounding: false

universe:
  market: US
  # LIQUIDITY PIVOT 2026-06-15: moved OFF micro/small-caps toward liquid mid/large
  # caps. Small-cap OPTIONS carry a 13-29% bid-ask tax that systematically kills a
  # long-option buyer regardless of thesis (the committee on 2026-06-15 correctly
  # rejected PENG/CNXC/WGO on exactly this). Underlying >=$5 (drop penny junk),
  # turnover >=10M (liquid).
  # MID-CAP BAND 2026-06-27: max cap 500B -> 50B. The two competing forces are
  # liquidity (large caps -> tight option spreads) and inefficiency (smaller caps
  # -> real catalyst edge). The 3B-50B mid-cap band is the sweet spot: option
  # spreads still tradeable, but enough mispricing for a catalyst to move the name
  # before it is fully arbitraged. 500B let in mega-caps (NVDA/AAPL/MSFT) that are
  # too efficient to ever clear the committee -- they only entered via the (now
  # emptied) watchlist anyway. EVALUATION: widen back toward 100-500B if the
  # mid-cap pool proves too thin to populate the universe.
  min_underlying_price_usd: 5
  # SMALL-ACCOUNT CEILING 2026-06-27: cap the share price so a near-the-money
  # option fits a $500 account. Premium scales with share price; at <=$50 a 30-45d
  # near-money contract runs ~$150-400 (high delta, higher win prob) instead of
  # the $600-1500 a $200 name costs (which forces deep-OTM lottery tickets). Kept
  # WITH the turnover/market-cap/liquidity filters so we get LOW-priced LIQUID
  # names (tight option spreads), not the micro-caps with the 13-29% spread tax.
  # 0 disables. EVALUATION: raise toward $80 if the <=$50 pool runs too thin.
  max_underlying_price_usd: 50
  min_market_cap_usd: 3000000000
  max_market_cap_usd: 50000000000
  min_average_daily_turnover_usd: 10000000
  require_listed_equity: true
  reject_otc: true
  reject_halted: true
  # Moomoo industry plates that never get an optionability probe (SPAC shells
  # flood the volume-ratio ranking but essentially never have eligible options).
  excluded_industries: ["Shell Companies"]
  # Pre-move accumulation bias (P1, 2026-06-26). Volume-ratio selection kept
  # picking names that ALREADY spiked, which the committee then vetoed as
  # "catalyst already priced in" (the dominant 0-entries cause). This down-ranks a
  # name by penalty * |day-move %|: score = volume_ratio / (1 + 0.1*|chg%|), so a
  # name up 10% is ranked ~half a same-volume name that has not moved yet (volume
  # building before the move). 0 = legacy pure volume_ratio. EVALUATION -- raise
  # to bias harder toward accumulation, lower/0 to revert. Only affects the
  # volume backfill now that earnings-window names are preferred first.
  premove_change_penalty: 0.1
  # EMPTIED 2026-06-27. The watchlist was 15 static mega-caps PREPENDED to the
  # top of every cycle, ahead of the fresh catalysts -- and they are the worst
  # fit for this strategy: no catalyst edge (committee vetoes "already priced
  # in"), ATM options over the $325 cost cap (TSLA call $1751 on 06-26), earnings
  # beyond the DTE window, and QQQ is an ETF with no single-name thesis at all.
  # Audit 2026-06-26: the watchlist took 20% of committee runs + 36% of the
  # no_eligible_contracts churn for 0 entries, and it re-injected exactly the
  # >max_market_cap_usd names the scan filter is designed to exclude. The scan's
  # own market-cap band now defines the universe. select_universe still treats a
  # watchlist as a FALLBACK (appended to backfill empty slots only), so populate
  # this again ONLY with names you want traded on days the catalyst scan runs dry.
  watchlist: []

options:
  allowed_opening_actions: [buy_call, buy_put]
  allowed_closing_actions: [sell_to_close]
  contracts_per_order: 1
  min_dte: 14
  max_dte: 45
  min_option_bid_usd: 0.05
  # Single-contract cost cap = 65% of the $500 budget = $325 (ask <= ~$3.24).
  # ALIGNED 2026-06-27 with portfolio.max_single_position_cost_usd (also $325):
  # this is the value the committee is TOLD it may spend, and the risk gate now
  # enforces the SAME number, so the committee no longer proposes a contract the
  # gate then rejects (the prior 2000-vs-800 mismatch wasted committee runs and
  # produced "premium too big for account" vetoes). With max_underlying_price_usd
  # capping the share price, $325 reaches near-the-money (high-delta) strikes
  # rather than deep-OTM lottery tickets.
  max_contract_cost_usd: 325
  # 2026-06-15 EVENING fix: spread<=15 KEPT (the real liquidity cost; the free feed
  # reports it reliably -- ROKU near-money strikes were 5-12%). But OI>=100 / vol>=10
  # blocked ~24/25 liquid names: the free feed returns NO per-contract volume
  # (vol=None->0, so vol>=10 was UNSATISFIABLE), and many real strikes sit at OI
  # 25-90. So min_daily_volume -> 0 (feed can't provide it; rely on OI + spread) and
  # min_open_interest 100 -> 25 (admits genuinely-traded strikes; spread<=15 still
  # guarantees a tradeable market). This only widens CONTRACT eligibility so names
  # reach the committee; the committee bar (win-prob / MC / vetoes) is untouched.
  max_bid_ask_spread_pct: 15
  min_open_interest: 25
  min_daily_volume: 0
  use_limit_orders_only: true
  reject_auto_exercise: true
  force_close_before_expiry_trading_days: 2
  fee_buffer_usd: 1
  # Both DeepSeek tiers (flash analysts + pro skeptic/risk/PM) must estimate at
  # least this win probability; the LOWEST estimate is binding. Breakeven at
  # TP+100/SL-50 with ~20% friction is ~0.47, so 0.55 keeps an ~0.08 positive-EV
  # margin. LOWERED 0.60 -> 0.55 on 2026-06-17: audit funnel showed only 2/193
  # committee runs ever died on this floor (91% died on the adversary VETO), so
  # the floor was not the bottleneck; trimmed slightly toward breakeven anyway.
  # Do NOT drop below 0.55 -- 0.50 leaves only ~0.03 over breakeven, negative-EV
  # once the model's win-prob is even mildly over-optimistic.
  min_estimated_win_probability: 0.55
  # Deterministic Monte Carlo baseline (no-edge GBM): rejects tickets so
  # hopeless that no catalyst edge could plausibly rescue them. LOWERED 0.3 ->
  # 0.25 on 2026-06-17 (toward the original 0.20); still well below the AI bar
  # (math sets the floor, the AIs claim the edge above it). Rarely the binding
  # gate (~1/193 runs reached it), so this is a minor loosening.
  min_monte_carlo_pop: 0.25
  # Soft-veto penalty. 0 = legacy behavior (a skeptic/risk VETO is an absolute
  # block). SET 0.10 on 2026-06-17: a veto no longer hard-blocks -- it instead
  # docks the binding win-probability by this amount per standing veto (and drops
  # that role's own low estimate from the min), so the portfolio_manager may
  # override a veto only with conviction high enough to still clear the win floor.
  # At penalty 0.10 + floor 0.55: ONE veto needs PM confidence >= 0.65, TWO need
  # >= 0.75. This is the real lever -- 91% of candidates were dying on hard vetoes
  # that short-circuited before the numeric floors ever ran.
  veto_win_prob_penalty: 0.02
  # Pre-screen catalyst gate (cost filter before the LLM committee). LOWERED
  # 20.0 -> 15.0 on 2026-06-25: at 20.0 the 2026-06-18..24 paper run scored a max
  # catalyst total of 17.8 (median 10.2) on the liquid mid-cap universe, so NOTHING
  # reached the committee and the agent opened ZERO new positions for 6 sessions.
  # The veto is already near-off (penalty 0.02) and the win-prob/MC floors were
  # loosened on 2026-06-17, confirming the binding gate had moved upstream to here.
  # 15.0 lets the top tier (~the [15,20) cluster) through to the committee, which
  # still applies the real quality gates; the thesis-keyed decision cache keeps the
  # extra committee runs from re-burning tokens. Tune lower only if the drought
  # persists -- this is a cost filter, not a quality bar.
  min_catalyst_score_for_committee: 15.0
  # --- Phase 1: pre-catalyst (earnings) IV-ramp selection ---
  # ACTIVATED 2026-06-26. Safe to enable now because select_universe PREFERS
  # upcoming-earnings names then BACKFILLS with volume-ratio (commit 5b2155b), so
  # the window can no longer starve the universe to 0-1 names (the 2026-06-15
  # failure that forced the revert). Finnhub key also refreshed in .env the same
  # day -- the prior key 401'd, so the bulk earnings calendar had been silently
  # empty. WHY: volume-ratio alone kept feeding already-spiked names the committee
  # vetoed as "priced in" (0 entries for many sessions); buying 10-25 days BEFORE
  # earnings catches the IV ramp and exits 2 trading days before the print. This
  # is an EVALUATION -- pre-earnings names can still draw binary/IV-crush vetoes,
  # so watch the entry count. Revert by setting both windows back to 0.
  earnings_window_min_days: 10   # skip earnings <10d out (IV already ramped, crush imminent)
  earnings_window_max_days: 25   # >0 switches to earnings-window-preferred selection + volume backfill
  pre_earnings_exit_trading_days: 2   # EXIT safety: close a held position 2 trading days before its earnings (avoid IV-crush). Uses the Finnhub calendar in .env.
  # ENABLED 2026-06-26: reject a contract whose own implied vol (DECIMAL, e.g.
  # 0.80 = 80%) exceeds this -- the absolute "already-ramped vol" backstop that
  # pairs with the pre-earnings selection (don't buy a call into peak IV and eat
  # the crush). 0.80 only blocks the egregious cases; the relative
  # max_iv_rank_for_long_premium gate below is the precise tool. Tune down toward
  # observed earnings-window IVs once IV Rank history has accumulated.
  max_entry_iv: 0.80
  min_abs_delta: 0.20
  max_gamma_per_contract: 2.0
  max_theta_decay_pct_per_day: 8.0
  # Reject long premium when IV Rank > this (vol expensive vs its own 52w range).
  # Already enabled; the binding fix shipped 2026-06-26 was the iv30 DATA flow
  # (Yahoo's snapshot omits iv30, so IV Rank was starved) -- the orchestrator now
  # derives iv30 from the at-the-money chain. Tighten toward 0.50 once real IV
  # Rank history accrues to enforce "buy cheap vol" for the pre-earnings ramp.
  max_iv_rank_for_long_premium: 0.80
  iv_crush_exit_drop_pct: 25.0
  # Profit protection: after a position has shown >=30% profit at the bid,
  # sell if 35% of that open profit is given back. This catches AAPL-like
  # near-TP spikes that reverse before the fixed take-profit line.
  trailing_profit_activation_pct: 30.0
  trailing_profit_giveback_pct: 35.0
  # Exit grid TIGHTENED 2026-06-26: take-profit +100% -> +50% (stop stays -50%).
  # WHY: every committee win-prob estimate capped at ~0.40 (max), all below the
  # 0.55 floor -> 0 entries, because hitting +100% on a long option needs a big
  # move (structurally <50% win rate). A +50% target is far easier to hit, so the
  # MC baseline AND the committee's win-prob estimates rise enough to clear 0.55
  # WITHOUT lowering the floor. Drives the MC-POP grid + the committee briefing
  # (both now read these, not hardcoded 100/50) so the model estimates the right
  # target. TRADEOFF: a tighter TP raises the no-friction breakeven 0.33 -> 0.50,
  # so the 0.55 floor's EV margin is thinner -- an evaluation; revert TP to 100 if
  # the realized win rate doesn't clear ~0.55. SL kept at 50.
  default_take_profit_pct: 50.0
  default_stop_loss_pct: 50.0

portfolio:
  # The $500 TOTAL LOSS BUDGET (operator 2026-06-15: "use what you want, never
  # lose more than the budget"). SCALED TO $500 on 2026-06-27 to match the intended
  # live capital; the $50 share-price ceiling now makes near-money options
  # affordable here (the reason $500 was raised to 2000 before -- without a price
  # ceiling the universe held $50-200 names whose near-money options cost >$500).
  # max_total_premium_at_risk_usd caps total option exposure -- and since these are
  # LONG options (max loss = premium), that ceiling bounds total possible loss to
  # the budget. hard_drawdown_stop_usd writes HALT once cumulative drawdown hits
  # the full budget. daily_loss_stop set equal to the budget (no tighter daily
  # %-brake, per "don't limit by %"); put a smaller number here for a per-day brake.
  # single-position cost = 65% of $500 = $325, ALIGNED with options.max_contract_cost_usd
  # (the committee is told the same number the gate enforces -- no more mismatch).
  max_open_positions: 2
  max_total_premium_at_risk_usd: 500
  max_single_position_cost_usd: 325
  max_new_positions_per_day: 2
  daily_loss_stop_usd: 500
  hard_drawdown_stop_usd: 500
  consecutive_loss_stop: 3
  cooldown_after_consecutive_losses_hours: 24
  # No new entries when the VIX is above this (panic regime guard); exits still run.
  max_vix_for_entries: 35

execution:
  # 0 on purpose: Moomoo SIMULATE charges no fees, and the local ledger must
  # mirror the broker sim. Live sets a real per-side commission.
  commission_per_contract_usd: 0
  stale_quote_seconds: 15
  # Wider age limit applied only to delayed free-feed quotes (CBOE/Tradier ~15min).
  delayed_quote_max_age_seconds: 1200
  cancel_unfilled_order_seconds: 60
  max_limit_chase_pct: 5
  kill_switch_file: runtime/HALT
  # No new entries in the first N minutes after the open (widest spreads).
  no_entry_minutes_after_open: 15
  # Hard daily LLM token budget; committee skipped once exceeded. Measured
  # 2026-06-12: a committee pass (5 roles, full evidence + 8-K bodies + candidate
  # list) costs ~33k tokens (prompt ~30-36k + completion ~2.5-3k), NOT the
  # 10-15k once assumed -- so 300k only bought ~9 passes/day and a 25-name
  # universe exhausted it in 1-2 cycles, blocking the committee the rest of the
  # day. Raised to 1,000,000 (~30 passes/day) so the committee can work the full
  # session. DeepSeek pricing makes this only cents/day.
  # Raised 1,000,000 -> 2,000,000 on 2026-06-15 (operator choice): permanent
  # headroom so the committee is never budget-blocked mid-session. Still a HARD
  # ceiling (not unlimited) so a runaway bug -- e.g. the duplicate-loop double
  # spend seen 2026-06-15 -- stays capped. The IV-ramp selection's smaller
  # pre-earnings universe makes a normal single-loop day cost well under this.
  # RAISED 2M -> 5M on 2026-06-19: pre-screen filters (red flags, weak
  # catalysts, IV ceiling) now skip ~25% of committee runs before LLM, but
  # 2M was still exhausted by 25-ticker universes. 5M (~125 committee passes)
  # covers a full session with headroom. DeepSeek pricing: ~$0.05/day.
  max_daily_llm_tokens: 5000000
  # Cache unchanged committee HOLD/REJECT decisions for one trading day. The
  # thesis hash includes public evidence IDs, so fresh filings/news still force a
  # new committee run; this mainly prevents the same stale thesis from burning
  # another ~30k tokens after the old 6h TTL expires.
  decision_cache_ttl_hours: 24
  # Freeze each ticker's Google News headlines for 4h (2026-06-26). The RSS feed
  # reshuffles its top-N every request, so re-fetching each cycle churned the news
  # evidence IDs and busted the thesis cache even when nothing broke -- "both
  # changed" was 64% of misses and the budget hit 100% by mid-session on 06-25/26.
  # 4h spans the 2h rejection bench so a re-competing name still hits the thesis
  # cache; SEC filings stay real-time, so a fresh 8-K still forces a re-run.
  news_cache_ttl_hours: 4
  # Only bench fresh rejections out of universe selection for 2h. After that the
  # ticker can compete again; if evidence is unchanged, the 24h thesis cache
  # serves the decision without LLM spend.
  rejection_bench_hours: 2
  # Decouple cadence (2026-06-24): exits/stops are checked every 60s tick, but
  # the universe+committee entry evaluation only runs every 5 min. A committee
  # pass costs ~33k tokens, so a 25-name universe burns ~800k per full pass --
  # at 60s that exhausts 5M in minutes (1977 candidates went dark mid-session
  # on 2026-06-23). At 300s the committee fires ~once/5min, cutting burn ~5x
  # while take-profit/stop-loss still react each tick. 0 = evaluate every tick.
  entry_evaluation_interval_seconds: 300

