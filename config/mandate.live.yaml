account:
  initial_capital_usd: 100
  live_mode_requires_operator_flag: true
  withdrawal_capability: forbidden
  # Live keeps FIXED dollar caps: no compounding with real money until the
  # operator reviews paper results and changes this deliberately.
  compounding: false

universe:
  market: US
  min_underlying_price_usd: 2
  min_market_cap_usd: 100000000
  max_market_cap_usd: 5000000000
  min_average_daily_turnover_usd: 5000000
  require_listed_equity: true
  reject_otc: true
  reject_halted: true
  # Moomoo industry plates that never get an optionability probe (SPAC shells
  # flood the volume-ratio ranking but essentially never have eligible options).
  excluded_industries: ["Shell Companies"]

options:
  allowed_opening_actions: [buy_call, buy_put]
  allowed_closing_actions: [sell_to_close]
  contracts_per_order: 1
  min_dte: 14
  max_dte: 45
  min_option_bid_usd: 0.05
  max_contract_cost_usd: 25
  max_bid_ask_spread_pct: 15
  min_open_interest: 100
  min_daily_volume: 10
  use_limit_orders_only: true
  reject_auto_exercise: true
  force_close_before_expiry_trading_days: 2
  fee_buffer_usd: 1
  # Both AI lineages must estimate at least this win probability (lowest binds).
  min_estimated_win_probability: 0.55
  # Deterministic Monte Carlo no-edge baseline floor (see paper mandate).
  min_monte_carlo_pop: 0.2
  min_abs_delta: 0.20
  max_gamma_per_contract: 2.0
  max_theta_decay_pct_per_day: 8.0
  max_iv_rank_for_long_premium: 0.80
  iv_crush_exit_drop_pct: 25.0

portfolio:
  max_open_positions: 1
  max_total_premium_at_risk_usd: 25
  max_new_positions_per_day: 1
  daily_loss_stop_usd: 10
  hard_drawdown_stop_usd: 25
  consecutive_loss_stop: 3
  cooldown_after_consecutive_losses_hours: 24
  # No new entries when the VIX is above this (panic regime guard).
  max_vix_for_entries: 35

execution:
  # Per contract PER SIDE, deducted from realized ledger P/L (~ commission
  # USD0.65 + platform USD0.30 per contract on Moomoo; VERIFY against your
  # actual fee schedule before going live).
  commission_per_contract_usd: 0.95
  stale_quote_seconds: 15
  # Live should ideally trade on a real-time feed; this delayed ceiling is a
  # safety net for delayed-data quotes. Tighten or pay for real-time before live.
  delayed_quote_max_age_seconds: 1200
  cancel_unfilled_order_seconds: 60
  max_limit_chase_pct: 5
  kill_switch_file: runtime/HALT
  no_entry_minutes_after_open: 15
  max_daily_llm_tokens: 300000
